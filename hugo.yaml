baseURL: "https://a7ca3.github.io/" # 主站的 URL
title: a7ca3's Blog # 站点标题
copyright: "[©2025 a7ca3's Blog](https://a7ca3.github.io/)" # 网站的版权声明，通常显示在页脚
theme: PaperMod # 主题
languageCode: zh-cn # 语言

enableInlineShortcodes: true # shortcode，类似于模板变量，可以在写 markdown 的时候便捷地插入，官方文档中有一个视频讲的很通俗
hasCJKLanguage: true # 是否有 CJK 的字符
enableRobotsTXT: true # 允许生成 robots.txt
buildDrafts: false # 构建时是否包括草稿
buildFuture: false # 构建未来发布的内容
buildExpired: false # 构建过期的内容
enableEmoji: true # 允许 emoji
pygmentsUseClasses: true
defaultContentLanguage: zh # 顶部首先展示的语言界面
defaultContentLanguageInSubdir: false # 是否要在地址栏加上默认的语言代码

languages: 
  zh:
    languageName: "中文" # 展示的语言名
    weight: 1 # 权重
    taxonomies: # 分类系统
      category: categories
      tag: tags
    # https://gohugo.io/content-management/menus/#define-in-site-configuration
    menus:
      main:
        - name: 首页
          pageRef: /
          weight: 4 # 控制在页面上展示的前后顺序
        - name: 归档
          pageRef: archives/
          weight: 5
        - name: 分类
          pageRef: categories/
          weight: 6
        - name: 标签
          pageRef: tags/
          weight: 7
        - name: 搜索
          pageRef: search/
          weight: 8
        - name: 关于
          pageRef: about/
          weight: 9

outputs:
  home:
    - HTML
    - RSS
    - JSON

# ~~~~~~~~~
# 主题配置
# ~~~~~~~~~

pagerSize: 8 # 每页展示的文章数量

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  author: a7ca3
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  # 默认主题
  defaultTheme: auto # dark, light
  # 是否禁用主题切换按钮
  disableThemeToggle: false
  # 是否启用阅读时间展示
  ShowReadingTime: true
  # 是否启用分享按钮
  ShowShareButtons: false
  ShowPostNavLinks: false
  # 是否启用面包屑导航
  ShowBreadCrumbs: true
  # 是否显示代码复制按钮
  ShowCodeCopyButtons: true
  # 是否显示字数统计
  ShowWordCount: true
  # 是否在页面显示 RSS 按钮
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  # 是否禁用首页滚动到顶部
  disableScrollToTop: false
  # 是否启用评论系统
  comments: true
  # 是否隐藏 Meta 信息
  hidemeta: false
  # 是否隐藏文章摘要
  hideSummary: false
  # 是否显示目录
  showtoc: false
  # 是否默认展开文章目录
  tocopen: false

  # 搜索
  fuseOpts:
      isCaseSensitive: false # 是否大小写敏感
      shouldSort: true # 是否排序
      location: 0
      distance: 1000
      threshold: 0.4
      minMatchCharLength: 0
      # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
      keys: ["title", "permalink", "summary", "content"]
      includeMatches: true\

  # 主页展示模式
  # 个人信息模式
  profileMode:
    enabled: false # needs to be explicitly set
    title: Welcome to my Blog
    subtitle: ""
    imageUrl: "blog.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image

  # 主页 - 信息模式（默认）
  homeInfoParams:
    Title: "Welcome to a7ca3's blog 🐕"
    Content: "Hi there! 欢迎来到我的博客！欢迎您对文章的错误内容勘误。此博客正在施工中🚧 未来将会增加更多功能。如果你有好的建议欢迎留言或发送邮箱告诉我！"
  #  主页 - 信息模式 图标展示
  socialIcons:
    - name: github
      url: "https://github.com/a7ca3"
    - name: email
      url: "mailto:a7ca39@gmail.com"
    - name: hackthebox
      url: "https://app.hackthebox.com/users/2153180"

  # giscus设置
  giscus:
    repo: "a7ca3/a7ca3.github.io"
    repo-id: "R_kgDOOLlr0g"
    category: "Announcements"
    category-id: "DIC_kwDOOLlr0s4CoQhu"
    mapping: "pathname"
    strict: "0"
    reactions-enabled: "1"
    emit-metadata: "0"
    input-position: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    crossorigin: "anonymous"

  # 设置网站的标签页的图标，即 favicon
  assets:
      favicon: "favicon.png"
      favicon16x16: "favicon.png"
      favicon32x32: "favicon.png"
      apple_touch_icon: "favicon.png"
      safari_pinned_tab: "favicon.png"

  math: True

markup:
  goldmark:
    renderer:
      unsafe: true # 允许解析md文件中的html标签
  highlight:
    anchorLineNos: false # 不要给行号设置锚标
    codeFences: true # 代码围栏
    noClasses: false # 使用 CSS 类来控制样式
    lineNos: true # 代码行
    lineNumbersInTable: true # 避免将行号放入表格中，可避免代码复制时包含行号

ignoreFiles: # 忽略解析的文件
  - "/content/Template.md"

caches: # 修改图片缓存位置
  images:
    dir: :cacheDir/images